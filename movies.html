<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista filmów</title>
    <link rel="stylesheet" href="movies.css">
</head>
<body>
    <div class="page">
        <header>
            <h1>
                Lista filmów
            </h1>
        </header>
        <main>
            <p id="error"></p>
            <form id="form">
            <input id="title" type="text" placeholder="Podaj tytuł filmu">
            <input id="year" type="number" placeholder="Podaj rok wydania filmu">
            <button id="btn-add" type="submit">Dodaj</button>
            <button id="btn-cancel" type="button">Anuluj</button>
            </form>

            <div class="toolbar">
                <button id="filter-all">Wszystkie</button>
                <button id="filter-watched">Tylko obejrzane</button>

                <button id="sort-title">Tytuł A-Z</button>
                <button id="sort-year">Rok ↑</button>
            </div>

            <p id="stats"></p>

            <input id="search" type="text" placeholder="Szukaj filmu...">
            <ul id="form-list">
            </ul>
        </main>
    </div>
    
    <script src="movies.js">
    </script>
</body>
</html>
